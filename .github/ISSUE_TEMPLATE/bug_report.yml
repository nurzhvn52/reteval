name: Bug report
description: A wrong result, a crash or an unclear error message
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the full output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For a wrong metric value, show how you computed the expected one.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      description: A few lines of qrels and run that reproduce the problem.
      render: text
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `reteval --version` and `python --version`, and your OS.
    validations:
      required: true
