name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build and publish a GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - name: Run the test suite once more
        run: |
          python -m pip install -e ".[dev]" build
          pytest
      - run: python -m build
      - name: Create the release with the wheel and sdist attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --title "reteval $GITHUB_REF_NAME" --generate-notes
