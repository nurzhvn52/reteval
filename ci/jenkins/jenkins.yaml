jenkins:
  systemMessage: "reteval CI - Docker + Jenkins"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: ${JENKINS_ADMIN_ID}
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: http://localhost:${JENKINS_PORT}/
jobs:
  - script: >
      multibranchPipelineJob('reteval') {
        displayName('reteval')
        branchSources {
          git {
            id('reteval-repo')
            remote('https://github.com/nurzhvn52/reteval.git')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(10)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('2m')
          }
        }
      }
