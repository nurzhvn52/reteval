[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reteval"
version = "0.1.0"
description = "Reproducible evaluation of ranked retrieval runs: IR metrics, multi-seed aggregation and paired significance tests."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Nurzhan Serikbekov" }]
keywords = ["information retrieval", "evaluation", "RAG", "reproducibility", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Repository = "https://github.com/nurzhvn52/reteval"
Issues = "https://github.com/nurzhvn52/reteval/issues"
Changelog = "https://github.com/nurzhvn52/reteval/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/reteval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["reteval"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "N", "RUF"]

[tool.mypy]
files = ["src"]
strict = true
